<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>게시글 상세보기</title>
</head>
<body>
<h1>게시글 상세보기</h1>
<p><strong>제목:</strong> <span th:text="${board.title}"></span></p>
<p><strong>내용:</strong></p>
<p th:text="${board.content}"></p>
<p><strong>작성일:</strong> <span th:text="${board.createdAt}"></span></p>

<a href="/boards">목록으로</a>
<a th:href="@{/boards/edit/{id}(id=${board.id})}">수정</a>
<a th:href="@{/boards/delete/{id}(id=${board.id})}">삭제</a>
</body>
</html>
